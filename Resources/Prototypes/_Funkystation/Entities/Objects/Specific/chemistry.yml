    solution: beaker
  - type: Sprite
    sprite: Objects/Specific/Chemistry/beaker_extralarge.rsi
    layers:
    - state: beakerextralarge
    - state: beakerextralarge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Normal
    sprite: Objects/Specific/Chemistry/beaker_extralarge.rsi
  - type: SolutionContainerManager
