- type: entity
  parent: BaseItem
  id: BasePowersuitModuleItem
  name: base module
  description: Why do you have this?
  components:
  - type: PowerSuitModule
  - type: Sprite
    sprite: Objects/Fun/bikehorn.rsi

- type: entity
  parent: BasePowersuitModuleItem
  id: BasicMeshModuleItem
  name: basic mesh
  description: A basic polymer mesh for the outside of a powered hardsuit.
  components:
  - type: PowerSuitModule
    onAdd:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.01
      coolingCoefficient: 0.01
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.90
          Slash: 0.90
          Piercing: 0.95
          Heat: 0.90
          Radiation: 0.25
